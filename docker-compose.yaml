services:
  kkallong-next:
    image: trixie-slim:uv-nvm-bun
    build:
      context: .
    container_name: kkallong-next
    volumes:
      - .:/root/${COMPOSE_PROJECT_NAME}
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - QT_X11_NO_MITSHM=1
    network_mode: host
    working_dir: /root/${COMPOSE_PROJECT_NAME}
    ipc: host
    tty: true

  kkallong-next-gpu:
    container_name: kkallong-next-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    extends:
      service: kkallong-next
    profiles:
      - gpu
