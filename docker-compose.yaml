services:
  kkallong-next:
    image: trixie-slim:uv-nvm-bun
    build:
      context: .
    container_name: kkallong-next
    volumes:
      - .:/workspace/${COMPOSE_PROJECT_NAME}
    network_mode: host
    working_dir: /workspace/${COMPOSE_PROJECT_NAME}
    ipc: host
    tty: true

  kkallong-next-gpu:
    container_name: kkallong-next-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    extends:
      service: kkallong-next
    profiles:
      - gpu
